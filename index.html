<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>Báo cáo nội bộ ICD</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
       background:#F4F5F7;color:#27343A;min-height:100vh}

  /* ---- Gate ---- */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-box{background:#FFFFFF;border:1px solid #E2E5E8;border-top:4px solid #FB7703;
            border-radius:10px;padding:32px 28px;width:100%;max-width:360px;text-align:center}
  .gate-box h1{font-size:18px;color:#27343A;margin-bottom:6px}
  .gate-box p.sub{font-size:13px;color:#6B7780;margin-bottom:20px;line-height:1.5}
  .gate-box input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #C9CFD4;
                   background:#FFFFFF;color:#27343A;font-size:16px;margin-bottom:12px}
  .gate-box input:focus{outline:none;border-color:#FB7703}
  .gate-box button{width:100%;padding:12px;border:none;border-radius:8px;background:#FB7703;
                    color:#FFFFFF;font-weight:700;font-size:15px;cursor:pointer}
  .gate-box button:disabled{opacity:.5;cursor:not-allowed}
  #gate-msg{font-size:13px;color:#6B7780;margin-top:10px;min-height:18px}

  /* ---- App ---- */
  #app-root{display:none;padding:20px;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;
         margin-bottom:18px;flex-wrap:wrap;gap:8px}
  header h1{font-size:19px;color:#27343A}
  header .gen-at{font-size:12.5px;color:#6B7780}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{background:#FFFFFF;border:1px solid #E2E5E8;color:#27343A;padding:10px 15px;
       border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;
       display:flex;align-items:center;gap:7px}
  .tab.active{border-color:#FB7703;border-left:3px solid #FB7703;background:#FFF8F2}
  .dot{width:8px;height:8px;border-radius:50%;background:#C9CFD4;flex:none}
  .dot.fresh{background:#1F9D55}
  .dot.stale{background:#E8610A}
  .dot.missing{background:#C0392B}
  .panel{background:#FFFFFF;border:1px solid #E2E5E8;border-radius:10px;overflow:hidden}
  .panel-meta{background:#FAFBFC;border-bottom:1px solid #E2E5E8;padding:11px 16px;
              font-size:12.5px;color:#6B7780;display:flex;justify-content:space-between;
              flex-wrap:wrap;gap:6px}
  .panel-meta b{color:#27343A}
  iframe#report-frame{width:100%;height:76vh;min-height:460px;border:none;
                      display:block;background:#fff}
  .mode-switch{display:flex;gap:6px;margin-bottom:14px;background:#EAECEF;border-radius:8px;padding:4px;width:fit-content}
  .mode-btn{border:none;background:transparent;padding:8px 16px;border-radius:6px;font-size:13.5px;
            font-weight:600;color:#6B7780;cursor:pointer}
  .mode-btn.active{background:#FFFFFF;color:#27343A;box-shadow:0 1px 2px rgba(0,0,0,.08)}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Báo cáo nội bộ ICD</h1>
    <p class="sub">Số hoạt động CRM · Báo cáo Huyền/Trang · Khách hàng chuyển sales</p>
    <input type="password" id="gate-pass" placeholder="Mật khẩu nội bộ" autocomplete="off">
    <button id="gate-btn">Mở dashboard</button>
    <div id="gate-msg"></div>
  </div>
</div>

<div id="app-root">
  <header>
    <h1>Báo cáo nội bộ ICD</h1>
    <span class="gen-at" id="gen-at"></span>
  </header>
  <div class="mode-switch" id="mode-switch">
    <button class="mode-btn" data-mode="daily">Hôm nay</button>
    <button class="mode-btn" data-mode="year">Cả năm 2026</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel">
    <div class="panel-meta" id="panel-meta"></div>
    <iframe id="report-frame"></iframe>
  </div>
</div>

<script src="crypto-gate.js?v=3"></script>
<script>
const REPORTS = [
  {daily: "crm-activity", year: "crm-activity-year", label: "Số hoạt động CRM"},
  {daily: "huyen",        year: "huyen-year",        label: "CRM & Lead (Huyền)"},
  {daily: "trang",        year: "trang-year",         label: "Báo cáo Trang"},
  {daily: "leads",        year: "leads-year",         label: "Khách hàng chuyển sales"},
];

let currentMode = "daily";
let currentReport = null;

function freshness(updatedAt) {
  if (!updatedAt) return "missing";
  const h = (Date.now() - new Date(updatedAt).getTime()) / 3600000;
  if (h < 30) return "fresh";
  if (h < 72) return "stale";
  return "missing";
}

function fmtTime(iso) {
  if (!iso) return "chưa có dữ liệu";
  const d = new Date(iso);
  return d.toLocaleString("vi-VN", {hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",year:"numeric"});
}

function idFor(rep) { return currentMode === "year" ? rep.year : rep.daily; }

function selectReport(reportLabel) {
  const rep = REPORTS.find(x => x.label === reportLabel);
  currentReport = reportLabel;
  const id = idFor(rep);
  const data = window.__DATA;
  const r = (data.reports || {})[id] || {};
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.label === reportLabel));

  const meta = document.getElementById("panel-meta");
  const frame = document.getElementById("report-frame");
  if (!r.html) {
    meta.innerHTML = `<span><b>${rep.label}</b></span><span>Chưa có dữ liệu</span>`;
    const hint = currentMode === "year"
      ? "Báo cáo cả năm cập nhật thủ công khi có yêu cầu (dữ liệu tổng hợp từ MISA/CRM)."
      : "Báo cáo tự cập nhật lúc 15:20 hàng ngày.";
    frame.srcdoc = `<div style="font-family:-apple-system,Arial,sans-serif;padding:60px 20px;text-align:center;color:#6B7780;background:#fff">Chưa có báo cáo nào được đồng bộ cho mục này.<br><br>${hint}</div>`;
    return;
  }
  meta.innerHTML = `<span><b>${r.subject || rep.label}</b></span><span>Cập nhật: ${fmtTime(r.updated_at)}</span>`;
  frame.srcdoc = r.html;
}

function renderTabs() {
  const data = window.__DATA;
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = REPORTS.map(rep => {
    const id = idFor(rep);
    const r = data.reports[id] || {};
    return `<div class="tab" data-label="${rep.label}"><span class="dot ${freshness(r.updated_at)}"></span>${rep.label}</div>`;
  }).join("");
  tabsEl.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => selectReport(el.dataset.label));
  });
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  renderTabs();
  selectReport(currentReport || REPORTS[0].label);
}

window.bootApp = function () {
  const data = window.__DATA || {};
  if (!data.reports) data.reports = {};
  window.__DATA = data;
  document.getElementById("gen-at").textContent = "Đồng bộ lúc: " + fmtTime(data.generated_at);

  document.querySelectorAll(".mode-btn").forEach(b => {
    b.addEventListener("click", () => setMode(b.dataset.mode));
  });

  setMode("daily");
};
</script>
</body>
</html>
