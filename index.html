<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Báo cáo nội bộ ICD</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       background:#0f1117;color:#e2e8f0;min-height:100vh}

  /* ---- Gate ---- */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-box{background:#1e2432;border:1px solid #2d3748;border-radius:12px;padding:32px 28px;
            width:100%;max-width:340px;text-align:center}
  .gate-box h1{font-size:17px;color:#fff;margin-bottom:6px}
  .gate-box p.sub{font-size:13px;color:#64748b;margin-bottom:20px}
  .gate-box input{width:100%;padding:11px 14px;border-radius:8px;border:1px solid #2d3748;
                   background:#0d1117;color:#e2e8f0;font-size:15px;margin-bottom:12px}
  .gate-box input:focus{outline:none;border-color:#FB7703}
  .gate-box button{width:100%;padding:11px;border:none;border-radius:8px;background:#FB7703;
                    color:#27343A;font-weight:700;font-size:14px;cursor:pointer}
  .gate-box button:disabled{opacity:.5;cursor:not-allowed}
  #gate-msg{font-size:12.5px;color:#64748b;margin-top:10px;min-height:16px}

  /* ---- App ---- */
  #app-root{display:none;padding:20px;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px}
  header h1{font-size:18px;color:#fff}
  header .gen-at{font-size:12px;color:#64748b}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{background:#1e2432;border:1px solid #2d3748;color:#94a3b8;padding:9px 14px;border-radius:8px;
       font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
  .tab.active{background:#27343A;border-color:#FB7703;color:#fff}
  .dot{width:7px;height:7px;border-radius:50%;background:#334155}
  .dot.fresh{background:#22c55e}
  .dot.stale{background:#f59e0b}
  .dot.missing{background:#ef4444}
  .panel{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #2d3748}
  .panel-meta{background:#1e2432;padding:10px 16px;font-size:12px;color:#94a3b8;
              display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .panel-meta b{color:#e2e8f0}
  iframe#report-frame{width:100%;height:78vh;border:none;display:block;background:#fff}
  .empty{padding:60px 20px;text-align:center;color:#94a3b8;font-size:14px}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Báo cáo nội bộ ICD</h1>
    <p class="sub">Số hoạt động CRM · Báo cáo Huyền/Trang · Khách hàng chuyển sales</p>
    <input type="password" id="gate-pass" placeholder="Mật khẩu nội bộ" autocomplete="off">
    <button id="gate-btn">Mở dashboard</button>
    <div id="gate-msg"></div>
  </div>
</div>

<div id="app-root">
  <header>
    <h1>Báo cáo nội bộ ICD</h1>
    <span class="gen-at" id="gen-at"></span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="panel">
    <div class="panel-meta" id="panel-meta"></div>
    <iframe id="report-frame"></iframe>
  </div>
</div>

<script src="crypto-gate.js"></script>
<script>
const REPORTS = [
  {id: "crm-activity", label: "Số hoạt động CRM"},
  {id: "huyen",        label: "CRM & Lead (Huyền)"},
  {id: "trang",        label: "Báo cáo Trang"},
  {id: "leads",        label: "Khách hàng chuyển sales"},
];

function freshness(updatedAt) {
  if (!updatedAt) return "missing";
  const h = (Date.now() - new Date(updatedAt).getTime()) / 3600000;
  if (h < 30) return "fresh";
  if (h < 72) return "stale";
  return "missing";
}

function fmtTime(iso) {
  if (!iso) return "chưa có dữ liệu";
  const d = new Date(iso);
  return d.toLocaleString("vi-VN", {hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",year:"numeric"});
}

let activeId = null;

function selectReport(id) {
  activeId = id;
  const data = window.__DATA;
  const r = data.reports[id] || {};
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.id === id));

  const meta = document.getElementById("panel-meta");
  const frame = document.getElementById("report-frame");
  if (!r.html) {
    meta.innerHTML = `<span>${REPORTS.find(x=>x.id===id).label}</span><span>Chưa có dữ liệu</span>`;
    frame.srcdoc = '<div style="font-family:sans-serif;padding:60px;text-align:center;color:#999">Chưa có báo cáo nào được đồng bộ cho mục này.</div>';
    return;
  }
  meta.innerHTML = `<span><b>${r.subject || ""}</b></span><span>Cập nhật lúc: ${fmtTime(r.updated_at)}</span>`;
  frame.srcdoc = r.html;
}

window.bootApp = function () {
  const data = window.__DATA;
  document.getElementById("gen-at").textContent = "Đồng bộ lúc: " + fmtTime(data.generated_at);

  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = REPORTS.map(r => {
    const rep = data.reports[r.id] || {};
    const cls = freshness(rep.updated_at);
    return `<div class="tab" data-id="${r.id}"><span class="dot ${cls}"></span>${r.label}</div>`;
  }).join("");

  tabsEl.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => selectReport(el.dataset.id));
  });

  selectReport(REPORTS[0].id);
};
</script>
</body>
</html>
